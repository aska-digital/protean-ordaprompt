name: protean-ordaprompt
version: 1.0.0
# manifest_version stays at 1: the installer on Hermes 0.21.x refuses anything
# above its own _SUPPORTED_MANIFEST_VERSION. All v2 fields (api_version, config_schema,
# python_dependencies, license, homepage, tags) are additive and read regardless.
manifest_version: 1
api_version: 1
description: "Fail-closed three-band classifier router for OrdaPilot request routing (topic + session utility). Ships a stdlib-only Python package, a CLI (python3 -m ordaprompt_router.cli) and an offline eval harness. Disclosure — sends nothing anywhere by default: the optional OpenRouter backend is disabled by policy and, when explicitly enabled, transports hashes and labels only. The automatic band is LOCKED OFF until calibration unlock criteria pass on real feedback data."
author: ahrazzle
license: MIT
homepage: https://github.com/aska-digital/protean-ordaprompt
tags: [router, classification, privacy, fail-closed, cli, eval]
python_dependencies: []
provides_tools: []
provides_hooks: []
# Deliberately EMPTY: the plugin declares no settings. All routing configuration is
# explicit JSON passed to the CLI (--config / --calibration); nothing is read from or
# written to the Hermes profile config. No ambient config surface to misconfigure.
config_schema: {}
