name: protean-ordaprompt
version: 1.1.0
# manifest_version stays at 1: the installer on Hermes 0.21.x refuses anything
# above its own _SUPPORTED_MANIFEST_VERSION. All v2 fields (api_version, config_schema,
# python_dependencies, license, homepage, tags) are additive and read regardless.
manifest_version: 1
api_version: 1
description: "Jev-style comparative classifier for OrdaPilot. It compares all topic labels and session choices in one batch, including new-topic, ambiguous, and new-session options. It uses calibrated score and margin gates, weighs continuity against context cost and contamination, and abstains when uncertain. OpenRouter is optional for provisional new-label proposals and is disabled by default."
author: ahrazzle
license: MIT
homepage: https://github.com/aska-digital/protean-ordaprompt
tags: [router, classification, jev, openjev, nli, session-routing, privacy, fail-closed, cli, eval]
python_dependencies: []
provides_tools: []
provides_hooks: []
# Deliberately EMPTY: the plugin declares no settings. All routing configuration is
# explicit JSON passed to the CLI (--config / --calibration); nothing is read from or
# written to the Hermes profile config. No ambient config surface to misconfigure.
config_schema: {}
